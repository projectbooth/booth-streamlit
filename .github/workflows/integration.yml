name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): real-cluster integration tests on kind. Runs
# on merge to main, nightly, and by hand; not on every push. See test/integration/README.md for
# what each job covers and what it does not.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  standins:
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (ADR 0099)
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: booth-streamlit-ci

      - uses: azure/setup-helm@v4

      - name: Build and load the booth-streamlit image
        run: |
          docker build -t booth-streamlit:ci .
          kind load docker-image booth-streamlit:ci --name booth-streamlit-ci

      - name: Deploy with stand-in PostgreSQL and NATS
        run: test/integration/deploy-standins.sh booth-streamlit:ci

      - name: Verify
        run: test/integration/verify.sh

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n booth-streamlit get all
          kubectl -n booth-streamlit describe pods | tail -60
          kubectl -n booth-streamlit logs deployment/booth-streamlit --tail=200 || true
  real-core:
    # The install path a user actually takes: booth-core provisions the database and mints the
    # bus credential from this chart's BoothModule. booth-core is built at a pinned commit, not its
    # moving main (contracts/testing-strategy.md); bump CORE_REF deliberately. booth-database
    # (ADR 0081) is the real workspace database the data-access checks read; DATABASE_REF is the
    # commit booth-api's realstack test pins.
    runs-on: ubuntu-24.04
    env:
      CORE_REF: 9e2999948079b55d19493aab72718e10940b9803
      DATABASE_REF: bdab4b82dc662ab4bb4afa9d3084b0b765943eae
      # The file read proxy reads through these (files-access.sh): their main at the time of
      # data-access step b; CATALOG_REF is also what booth-api's realstack test pins.
      STORAGE_REF: 177076640f3c94e8620d6a2ee703d5404d840a84
      CATALOG_REF: c46f80f32dcc04206f4a4700de9fad47aaf75757
      # The lakehouse checks (lakehouse-access.sh): booth-lakehouse's main at the time of data-access
      # step c. Its chart pins Lakekeeper by digest; the MinIO fixture is pinned in realcore/minio.yaml.
      LAKEHOUSE_REF: d7ed5338bb89bf00002546b0f3a5fdb07da681b5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: projectbooth/booth-core
          ref: ${{ env.CORE_REF }}
          path: booth-core

      - uses: actions/checkout@v4
        with:
          repository: projectbooth/booth-database
          ref: ${{ env.DATABASE_REF }}
          path: booth-database

      - uses: actions/checkout@v4
        with:
          repository: projectbooth/booth-storage
          ref: ${{ env.STORAGE_REF }}
          path: booth-storage

      - uses: actions/checkout@v4
        with:
          repository: projectbooth/booth-catalog
          ref: ${{ env.CATALOG_REF }}
          path: booth-catalog

      - uses: actions/checkout@v4
        with:
          repository: projectbooth/booth-lakehouse
          ref: ${{ env.LAKEHOUSE_REF }}
          path: booth-lakehouse

      - uses: helm/kind-action@v1
        with:
          cluster_name: booth-streamlit-realcore

      - uses: azure/setup-helm@v4

      - name: Build and load booth-core, booth-database, booth-storage, booth-catalog, booth-lakehouse, booth-streamlit and app-runtime images
        run: |
          # dependency build (not update) installs exactly what core's Chart.lock pins.
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm dependency build booth-core/charts/booth-core
          docker build -t booth-core:ci booth-core
          docker build -t booth-database:ci booth-database
          docker build -t booth-storage:ci booth-storage
          docker build -t booth-catalog:ci booth-catalog
          docker build -t booth-lakehouse:ci booth-lakehouse
          docker build -t booth-streamlit:ci .
          docker build -t booth-streamlit-app-runtime:ci -f images/app-runtime/Dockerfile .
          kind load docker-image booth-core:ci booth-database:ci booth-storage:ci booth-catalog:ci booth-lakehouse:ci booth-streamlit:ci booth-streamlit-app-runtime:ci --name booth-streamlit-realcore

      - name: Deploy Keycloak, booth-core, booth-database, booth-storage, booth-catalog, booth-lakehouse, MinIO, the test package index and booth-streamlit (lifecycle and data-access test values)
        run: >-
          test/integration/deploy-realcore.sh booth-core booth-core:ci booth-streamlit:ci booth-streamlit-app-runtime:ci
          booth-database booth-database:ci booth-storage booth-storage:ci booth-catalog booth-catalog:ci
          booth-lakehouse booth-lakehouse:ci

      - name: Verify (including the REAL_CORE checks)
        env:
          REAL_CORE: "1"
        run: test/integration/verify.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: test/integration/browser/package-lock.json

      - name: Install Chromium for the browser checks
        run: cd test/integration/browser && npm ci && npx playwright install --with-deps chromium

      - name: Only workspace owners write apps, with real roles through core (ADR 0105)
        run: test/integration/api-authz.sh

      - name: "Lifecycle: start (and Chromium through core), gate, cap, idle, stop, reconcile"
        run: test/integration/lifecycle.sh

      - name: "File read proxy (ADR 0107): storage and catalog files, refusals, other workspaces, stolen bearer, paused owner"
        run: test/integration/files-access.sh

      - name: "Lakehouse (ADR 0107): Parquet through the s3 sidecar, read-only lease, scanner with the sidecar, pod roll on a refused renewal"
        run: test/integration/lakehouse-access.sh

      - name: "Data access (ADR 0107): reads as owner, token unreadable, stolen bearer, viewer cap, lost owner, take ownership"
        run: test/integration/data-access.sh

      - name: "Per-app packages (ADR 0107): install from the in-cluster test index, timings, mounts, scanner, bad requirement, hung install, closed egress"
        run: test/integration/pip-access.sh

      - name: "Lineage and events (ADR 0046): dashboards in the real booth-catalog, edit, unshare, NATS stopped and restarted"
        run: test/integration/events-access.sh

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n booth-system logs deployment/booth-core --tail=150 || true
          kubectl get boothmodules -A -o yaml || true
          kubectl -n booth-streamlit get secrets || true
          kubectl -n booth-streamlit describe pods | tail -60
          kubectl -n booth-streamlit logs deployment/booth-streamlit --tail=200 || true
          kubectl -n booth-streamlit get deploy,svc,configmap,pods -l booth.projectbooth.io/component=app -o wide || true
          kubectl -n booth-streamlit logs -l booth.projectbooth.io/component=app --all-containers --tail=80 || true
          kubectl -n booth-streamlit get events --sort-by=.lastTimestamp | tail -40 || true
          cat /tmp/booth-core-port-forward.log || true
          kubectl -n booth-database get pods || true
          kubectl -n booth-storage logs deploy/booth-storage --tail=60 || true
          kubectl -n booth-catalog logs deploy/booth-catalog --tail=60 || true
          kubectl -n booth-streamlit logs -l booth.projectbooth.io/component=app -c gate --tail=60 || true
          kubectl -n booth-database logs deploy/db-booth-database --tail=80 || true
          kubectl -n booth-streamlit logs -l booth.projectbooth.io/component=app -c pg-sidecar --tail=80 || true
          kubectl -n booth-streamlit logs -l booth.projectbooth.io/component=app -c s3-sidecar --tail=80 || true
          kubectl -n booth-lakehouse logs deploy/booth-lakehouse-api --tail=80 || true
          kubectl -n booth-lakehouse logs deploy/booth-lakehouse-lakekeeper --tail=40 || true
          kubectl -n booth-streamlit logs -l booth.projectbooth.io/component=app -c pip --tail=60 || true
          kubectl -n booth-pypi logs deploy/pypi --tail=40 || true
          kubectl -n booth-system get pods -l app.kubernetes.io/name=nats || true
          kubectl -n booth-catalog logs deploy/booth-catalog --tail=80 | grep -i -E "dashboard|event|nats" || true
          kubectl -n booth-system logs deploy/booth-core --tail=200 | grep -E "workload identity|credential" || true
