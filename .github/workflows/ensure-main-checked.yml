name: Ensure main is checked

# Every commit that lands on main must get a CI run and an Integration run. Normally the push event
# starts both. On 2026-10-08 GitHub dropped the push event for the PR #5 merge (a1570a3): the merge
# landed, but no PushEvent, no pr_merge activity entry and no check suites were ever created, so
# neither workflow ran. Nothing in the workflows' own triggers could have caught that.
#
# This backstop looks at main's head every 30 minutes and dispatches whichever of the two has no
# run for that exact commit (of any status: queued, running or finished all count, so a normal
# merge is never run twice). A workflow_dispatch made with GITHUB_TOKEN does start a run; it is the
# documented exception to "events made with GITHUB_TOKEN start no workflows".
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write # dispatch ci.yml / integration.yml
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (ADR 0099)
    steps:
      - name: Dispatch any missing run for main's head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/commits/main" -q .sha)
          echo "main is at $sha"
          for wf in ci.yml integration.yml; do
            n=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$sha&per_page=1" -q .total_count)
            if [ "$n" = 0 ]; then
              echo "::warning::$wf has no run for main@$sha (push event missed?); dispatching it"
              gh workflow run "$wf" --repo "$REPO" --ref main
            else
              echo "$wf: $n run(s) for $sha"
            fi
          done
