name: Release

# Publishes the container image and the Helm chart at a matching version, so booth-module-store's
# bundled catalog (and anyone installing via booth-core's install API) has a real chart reference,
# and other repos' tests can pin a known-good build instead of main. Mirrors booth-catalog's
# release workflow. Pushing a `vX.Y.Z` tag triggers it. The chart is also pushed to
# oci://ghcr.io/projectbooth/charts/booth-streamlit, the reference installs use (ADR 0111).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/projectbooth/booth-streamlit:${{ steps.version.outputs.version }}
            ghcr.io/projectbooth/booth-streamlit:latest

      - name: App runtime image (the per-app Streamlit container)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/app-runtime/Dockerfile
          push: true
          tags: |
            ghcr.io/projectbooth/booth-streamlit-app-runtime:${{ steps.version.outputs.version }}
            ghcr.io/projectbooth/booth-streamlit-app-runtime:latest

  chart:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package chart at the release version
        working-directory: charts/booth-streamlit
        run: |
          helm package . \
            --version "${{ needs.image.outputs.version }}" \
            --app-version "${{ needs.image.outputs.version }}" \
            --destination ../../dist

      - name: Attach chart to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true

      - name: helm registry login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart as an OCI artifact (ADR 0111)
        run: helm push dist/booth-streamlit-${{ needs.image.outputs.version }}.tgz oci://ghcr.io/projectbooth/charts
