apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-streamlit.fullname" . }}
  labels:
    {{- include "booth-streamlit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-streamlit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booth-streamlit.selectorLabels" . | nindent 8 }}
        booth.projectbooth.io/module: streamlit
    spec:
      serviceAccountName: {{ include "booth-streamlit.serviceAccountName" . }}
      # The backend runs each app as a Deployment, with exactly the namespace-scoped Role in
      # rbac.yaml.
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: booth-streamlit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.dataAccess.enabled }}
            # The internal port: app pods only (networkpolicy.yaml), never through booth-core.
            - name: internal
              containerPort: 8081
            {{- end }}
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            - name: BOOTH_IFRAME_IDENTITY_ISSUER_URL
              value: {{ required "identity.issuerUrl is required: app traffic is authenticated by booth-core's X-Booth-Identity assertion (ADR 0069)" .Values.identity.issuerUrl | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ .Values.identity.groupsClaim | quote }}
            # The per-app lifecycle (docs/design-v0.md (a)).
            - name: BOOTH_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: BOOTH_SELF_DEPLOYMENT
              value: {{ include "booth-streamlit.fullname" . | quote }}
            - name: BOOTH_APP_RUNTIME_IMAGE
              value: "{{ .Values.apps.runtimeImage.repository }}:{{ .Values.apps.runtimeImage.tag | default .Chart.AppVersion }}"
            - name: BOOTH_APP_GATE_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            - name: BOOTH_APP_IMAGE_PULL_POLICY
              value: {{ .Values.apps.imagePullPolicy | quote }}
            - name: BOOTH_APP_SERVICE_ACCOUNT
              value: "{{ include "booth-streamlit.fullname" . }}-app"
            - name: BOOTH_APP_RESOURCES
              value: {{ .Values.apps.resources | toJson | quote }}
            - name: BOOTH_APP_GATE_RESOURCES
              value: {{ .Values.apps.gateResources | toJson | quote }}
            - name: BOOTH_APP_TMP_SIZE_LIMIT
              value: {{ .Values.apps.tmpSizeLimit | quote }}
            - name: BOOTH_APP_MAX_RUNNING
              value: {{ .Values.apps.maxRunning | int | quote }}
            - name: BOOTH_APP_MAX_RUNNING_PER_WORKSPACE
              value: {{ .Values.apps.maxRunningPerWorkspace | int | quote }}
            - name: BOOTH_APP_IDLE_TIMEOUT
              value: {{ .Values.apps.idleTimeout | quote }}
            - name: BOOTH_APP_MAX_WEBSOCKET
              value: {{ .Values.apps.maxWebsocket | quote }}
            {{- if .Values.dataAccess.enabled }}
            # Data access (ADR 0104/0107).
            - name: BOOTH_DATA_ACCESS
              value: "true"
            # booth-core writes this Secret once the manifest declares workloadIdentity.mint. Not
            # optional: without it the backend can't give any app data, so it waits for it.
            - name: BOOTH_WORKLOAD_MINT_URL
              valueFrom:
                secretKeyRef: {name: booth-workload-minting-credentials, key: url}
            - name: BOOTH_WORKLOAD_MINT_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: booth-workload-minting-credentials, key: credential}
            - name: BOOTH_CORE_URL
              value: {{ required "dataAccess.coreUrl is required with dataAccess.enabled" .Values.dataAccess.coreUrl | quote }}
            - name: BOOTH_INTERNAL_ADDR
              value: ":8081"
            - name: BOOTH_INTERNAL_URL
              value: "http://{{ include "booth-streamlit.fullname" . }}.{{ .Release.Namespace }}.svc:8081"
            - name: BOOTH_APP_SIDECAR_IMAGE
              value: {{ .Values.dataAccess.sidecar.image | quote }}
            - name: BOOTH_APP_SIDECAR_RESOURCES
              value: {{ .Values.dataAccess.sidecar.resources | toJson | quote }}
            - name: BOOTH_APP_DATABASE
              value: {{ .Values.dataAccess.database.enabled | quote }}
            - name: BOOTH_APP_LAKEHOUSE
              value: {{ .Values.dataAccess.lakehouse.enabled | quote }}
            - name: BOOTH_FILES_MAX_OBJECT_BYTES
              value: {{ .Values.dataAccess.files.maxObjectBytes | int64 | quote }}
            - name: BOOTH_FILES_OBJECT_TIMEOUT
              value: {{ .Values.dataAccess.files.objectTimeout | quote }}
            - name: BOOTH_FILES_META_TIMEOUT
              value: {{ .Values.dataAccess.files.metaTimeout | quote }}
            - name: BOOTH_FILES_MAX_CONCURRENT
              value: {{ .Values.dataAccess.files.maxConcurrent | int | quote }}
            {{- with .Values.dataAccess.refreshMax }}
            - name: BOOTH_DATA_REFRESH_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: BOOTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "booth-streamlit.dsnSecretName" . }}
                  key: {{ .Values.postgres.dsnSecret.key }}
            {{- if .Values.eventBus.enabled }}
            {{- if .Values.eventBus.credentialsSecret.enabled }}
            # The credential booth-core minted for this module's declared `events` (ADR 0050). The
            # file is re-read on every reconnect, so core's in-place renewal is picked up.
            - name: BOOTH_NATS_CREDS_FILE
              value: /etc/booth/event-bus/nats.creds
            {{- if .Values.nats.url }}
            - name: BOOTH_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- else }}
            - name: BOOTH_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventBus.credentialsSecret.name }}
                  key: url
            {{- end }}
            {{- else }}
            - name: BOOTH_NATS_URL
              value: {{ required "nats.url is required when eventBus.credentialsSecret.enabled is false: with no credentials Secret to take the address from, the event bus has nowhere to connect (set eventBus.enabled=false to leave the event bus out on purpose)" .Values.nats.url | quote }}
            {{- end }}
            {{- end }}
          # /livez does not look at the database or the bus on purpose: restarting the pod cannot
          # fix either. /healthz (readiness, and what core polls) looks at the database.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if and .Values.eventBus.enabled .Values.eventBus.credentialsSecret.enabled }}
          volumeMounts:
            # A directory mount, deliberately not a single-file (sub-path) mount: the kubelet updates
            # a mounted Secret in place when core renews the credential, but never a sub-path one.
            - name: event-bus-credentials
              mountPath: /etc/booth/event-bus
              readOnly: true
          {{- end }}
      {{- if and .Values.eventBus.enabled .Values.eventBus.credentialsSecret.enabled }}
      volumes:
        - name: event-bus-credentials
          secret:
            secretName: {{ .Values.eventBus.credentialsSecret.name }}
            # Not `optional`: if booth-core hasn't written the credential the pod waits, visibly,
            # instead of starting without one.
            items:
              - key: nats.creds
                path: nats.creds
      {{- end }}
