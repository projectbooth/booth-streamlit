# The backend's Kubernetes API access: exactly the calls internal/lifecycle makes, verb for verb
# (docs/design-v0.md (a), "Backend RBAC", as built), namespace-scoped, nothing else. test/contract
# pins these rules exactly, so any widening has to change that test too. No `watch` anywhere: the
# lifecycle polls.
#
# - Deployments: create, update (scale and roll), delete, list (reconcile), get (the backend's own
#   Deployment once at startup, to own every app Deployment, and the create-raced-with path).
# - ConfigMaps (each app's source): create, update, delete, list, get (compare before updating).
# - Services: create, delete, list. A Service never changes after creation, so no update or get.
# - Pods: list only, to report why an app failed to start (image pull, crash loop).
# - Secrets: create only. The backend writes each app's gate bearer and can never read, list,
#   change or delete any Secret, including core's credentials in this namespace. It keeps its own
#   copy of each bearer in its database; a deleted app's Secret is removed by the garbage collector
#   through its owner reference, not by the backend.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "booth-streamlit.fullname" . }}-apps
  labels:
    {{- include "booth-streamlit.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "booth-streamlit.fullname" . }}-apps
  labels:
    {{- include "booth-streamlit.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "booth-streamlit.fullname" . }}-apps
subjects:
  - kind: ServiceAccount
    name: {{ include "booth-streamlit.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# App pods run as this account: no bindings, no token mounted (the lifecycle also sets
# automountServiceAccountToken: false on every app pod). User code gets no Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "booth-streamlit.fullname" . }}-app
  labels:
    {{- include "booth-streamlit.labels" . | nindent 4 }}
automountServiceAccountToken: false
