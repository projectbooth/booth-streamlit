# Default values for booth-streamlit.
#
# The chart runs the module backend. The backend itself creates one Deployment per running app in
# this namespace (docs/design-v0.md (a)), configured by `apps` below.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-streamlit
  tag: "" # defaults to Chart.appVersion; CI overrides it with the image it just built
  pullPolicy: IfNotPresent

service:
  port: 8080

# App definitions live in this module's own database on the shared PostgreSQL cluster (ADR 0014).
#
# By default booth-core provisions it (ADR 0053/0054): the BoothModule declares
# `database: {enabled: true}`, and core creates a database and unprivileged role and delivers them
# as the Secret `booth-database-credentials` (key `dsn`) in this release's namespace. The pod sits
# in CreateContainerConfigError for a moment after install until core has written it.
#
# To use your own database instead, set provisionedByCore to false and name a Secret holding the
# connection string in dsnSecret. This chart never creates the database, role or Secret itself.
postgres:
  provisionedByCore: true
  dsnSecret:
    # Empty means "booth-database-credentials" when provisionedByCore is true; required (no
    # default) when it is false.
    name: ""
    key: dsn

# The event bus (NATS, ADR 0021) that dashboard.created/updated/deleted events go out on, one per
# app (ADR 0018, payload per ADR 0046).
#
# booth-core's bus authenticates every connection (ADR 0049/0050): the BoothModule below declares
# `events: {publish: [dashboard.*]}`, and core answers by writing a Secret into this namespace with
# a credential scoped to exactly that plus the bus's in-cluster URL. The pod mounts it; there is
# nothing to configure. The pod will not start until core has written it, on purpose: a module that
# came up without the credential would look healthy while no app ever reached the catalog.
eventBus:
  # false leaves the bus out entirely: no `events` on the manifest, no credential, no connection.
  # Apps still run; booth-catalog never hears about them. An explicit choice, never the result of
  # forgetting a value.
  enabled: true
  credentialsSecret:
    # Read the credential from booth-core's Secret (the normal case). Set false only against a bus
    # with authentication off (a test stand-in), and then nats.url is required.
    enabled: true
    # The name booth-core gives it (ADR 0050).
    name: booth-event-bus-credentials

nats:
  # Overrides the URL in the credentials Secret. Leave empty in a real install. Required when
  # eventBus.credentialsSecret.enabled is false.
  url: ""

identity:
  # booth-core's iframe-identity issuer (ADR 0069). Every request to an app carries core's signed
  # X-Booth-Identity assertion, verified against this issuer's keys. It must equal core's
  # BOOTH_IFRAME_IDENTITY_ISSUER_URL EXACTLY: it is compared character-for-character with the
  # assertion's `iss`, and core's chart spells its default host "...svc.cluster.local:8080", not
  # the shorter "...svc:8080" other booth URLs use. The default matches core installed as release
  # "booth-core" in namespace "booth-system" (booth-logging and booth-notebooks use the same).
  issuerUrl: "http://booth-core.booth-system.svc.cluster.local:8080/iframe-identity"
  # The claim carrying workspace memberships (ADR 0025). Must match booth-core's.
  groupsClaim: groups

# Per-app containers (docs/design-v0.md (a)). Sized for a single-node homelab.
apps:
  # The Streamlit runtime image (images/app-runtime). Tag defaults to Chart.appVersion.
  runtimeImage:
    repository: ghcr.io/projectbooth/booth-streamlit-app-runtime
    tag: ""
  # Pull policy for the runtime and gate images in app pods.
  imagePullPolicy: IfNotPresent
  # The gate container in every app pod runs from the backend's own image (`image` above).
  # Per app: Streamlit's container.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 512Mi}
  # Per app: the gate.
  gateResources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 16Mi}
  # The writable /tmp of each app (the root filesystem is read-only).
  tmpSizeLimit: 256Mi
  # How many apps may run at once, install-wide and per workspace (0 = no cap). Raising maxRunning
  # also needs quota.hard raised.
  maxRunning: 5
  maxRunningPerWorkspace: 0
  # An app with no open browser tab and no request for this long is stopped; opening it again
  # starts it. 0 disables idle shutdown.
  idleTimeout: 30m
  # A websocket (one open tab) is closed after this long; Streamlit's client reconnects and the
  # viewer's identity is checked again.
  maxWebsocket: 8h
  egress:
    # ADR 0104 item 4: "open" = internet, but no in-cluster or link-local destinations;
    # "closed" = DNS only. See templates/networkpolicy.yaml.
    mode: open
    dns:
      namespaceSelector: {kubernetes.io/metadata.name: kube-system}
      podSelector: {k8s-app: kube-dns}

# Data access (ADR 0104/0107; docs/design-data-access.md): an app reads data as its owner, capped at
# viewer. Off by default. Turning it on:
#   - declares `workloadIdentity: {mint: true}` on the manifest, so booth-core delivers the
#     booth-workload-minting-credentials Secret this module mints each app's token with;
#   - opens the backend's internal port (8081) to app pods only: each app's gate fetches the token
#     there with its bearer, and the credential sidecars send their broker calls there, so app pods
#     never need a route to booth-core;
#   - with dataAccess.database.enabled, adds booth-core's credential sidecar (postgres mode, read
#     only, the app's own workspace) to every app pod and gives the app DATABASE_URL.
# An app can read what its owner, capped at viewer, can read in its workspace (ADR 0107 item 4).
dataAccess:
  enabled: false
  # booth-core's in-cluster address, for the broker (POST /api/credentials).
  coreUrl: http://booth-core.booth-system.svc:8080
  # booth-core's credential sidecar (ADR 0095), digest-pinned: the same digest booth-api,
  # booth-notebooks and booth-pipeline pin.
  sidecar:
    image: ghcr.io/projectbooth/credential-sidecar@sha256:6a0a795efd27f165e0714beb163d91f5c2feff55cfdc6f287aee979ae02cce14
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 16Mi}
  database:
    # booth-database is installed: app pods get the postgres sidecar and DATABASE_URL, and an egress
    # rule to booth-database's Postgres pod (match your install's namespace).
    enabled: false
    egress:
      namespaceSelector: {kubernetes.io/metadata.name: booth-database}
      podSelector: {app.kubernetes.io/name: booth-database, app.kubernetes.io/component: postgres}
      port: 5432
  # The file read proxy (booth_streamlit.files): booth-storage objects and catalog file datasets,
  # read only, as the app's owner capped at viewer. booth-storage and booth-catalog must trust
  # booth-core's workload-token issuer (booth-storage oidc.workloadIssuerUrl, booth-catalog
  # workloadIdentity.issuerUrl), or they refuse the app's token.
  files:
    maxObjectBytes: 536870912 # 512 MiB per object
    objectTimeout: 5m
    metaTimeout: 30s # dataset lookups and listings
    maxConcurrent: 4 # reads at once, per app
  # Test knob: re-mint tokens and re-fetch them in app pods at least this often (e.g. 20s), so a lost
  # owner is noticed in seconds. Empty (the default): two thirds of a token's life (~6.7 minutes).
  refreshMax: ""

# A ResourceQuota on this namespace, as a backstop below the running-app cap. The defaults fit
# apps.maxRunning=5 with the default per-app limits (including the data-access sidecar), plus the
# backend and room for one pod being replaced.
quota:
  enabled: true
  hard:
    pods: "8"
    limits.cpu: "7"
    limits.memory: 7Gi
    limits.ephemeral-storage: 4Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The backend itself is small: a Go process holding app metadata and proxying traffic. Sized for a
# single-node homelab; the per-app containers get their own, separate limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
    # Required with quota.enabled (the quota caps ephemeral storage, so every pod must declare it).
    ephemeral-storage: 256Mi

serviceAccount:
  create: true
  name: ""
