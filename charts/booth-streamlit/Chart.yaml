apiVersion: v2
name: booth-streamlit
description: >
  Project Booth's code-first dashboard/app module: users write Streamlit apps in Python and run
  them as hosted apps, one container per app, reached through the shell via iframe-proxy.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-streamlit

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells booth-core's
# install API which of this chart's values.yaml paths carry the platform's shared identity settings,
# so a module installed through the install API (the Module Store's Install button included) is
# configured without hand-typed values. Core fills a mapped path only when the request doesn't
# already set it. This chart verifies only core's iframe assertion (no OIDC issuer, client id, JWKS
# or workload issuer of its own), so it maps just the iframe issuer and the groups claim.
annotations:
  booth.projectbooth.io/identity-keys: |
    {"iframeIssuerUrl":"identity.issuerUrl","groupsClaim":"identity.groupsClaim"}
