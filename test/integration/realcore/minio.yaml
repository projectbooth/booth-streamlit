# An S3-compatible object store for the lakehouse checks (lakehouse-access.sh): booth-lakehouse's
# warehouse and booth-storage's s3-kind credential provider both need a real one. The same pinned test
# image, root credentials and `lake` bucket as booth-lakehouse's own fixture and booth-e2e's
# bringup/minio.yaml (ADR 0087/0091). Test infrastructure only, in its own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: booth-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: booth-minio
spec:
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: ghcr.io/projectbooth/minio-test@sha256:04c918e8877a410f40ccab0842f724177af453f236a5fda96df219867aefe3c3 # ADR 0087/0091
          imagePullPolicy: IfNotPresent
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: booth-test}
            - {name: MINIO_ROOT_PASSWORD, value: booth-test-secret}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 2
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "for i in $(seq 1 60); do mc alias set l http://127.0.0.1:9000 booth-test booth-test-secret >/dev/null 2>&1 && mc mb -p l/lake && exit 0; sleep 1; done; exit 1"]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: booth-minio
spec:
  selector: {app: minio}
  ports: [{port: 9000}]
