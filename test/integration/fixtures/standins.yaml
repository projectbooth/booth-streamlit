# Throwaway PostgreSQL and NATS for the stand-in integration job, standing in for the shared
# platform database (ADR 0014) and booth-core's bus (ADR 0021). Test fixtures only: fixed
# credentials, no auth on NATS, no persistence. The real-core job replaces both with booth-core's
# own, which is the authoritative check; this job stays because it isolates the module from core.
apiVersion: v1
kind: Secret
metadata:
  name: booth-streamlit-db
type: Opaque
stringData:
  dsn: postgres://booth:booth-test@postgres:5432/booth_streamlit?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: booth}
            - {name: POSTGRES_PASSWORD, value: booth-test}
            - {name: POSTGRES_DB, value: booth_streamlit}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "booth", "-d", "booth_streamlit"]
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: {app: nats}
  ports:
    - {name: client, port: 4222}
